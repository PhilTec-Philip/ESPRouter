name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platformio:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build firmware
        run: python -m platformio run

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-nodemcuv2
          path: .pio/build/nodemcuv2/firmware.bin
          if-no-files-found: error
